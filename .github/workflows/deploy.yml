# Tu dong build va dua trang len GitHub Pages moi khi day code len nhanh main.
#
# Vi sao can quy trinh nay: thu muc dist/ dang bi gitignore (dung vay, khong
# nen day file build vao repo). Nen GitHub phai tu build lai o day.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - run: npm run build
        env:
          # Dia chi server nhan xac nhan va loi chuc.
          # Khai bao o: Settings > Secrets and variables > Actions > Variables
          # Chua khai bao thi phan So Luu But va form xac nhan se tu an.
          VITE_API_URL: ${{ vars.VITE_API_URL }}

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
